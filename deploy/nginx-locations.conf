# The locations of Pupate's static export and the keeper's feeds. Rendered by deploy/update.sh to
# /etc/nginx/snippets/pupate-<domain>.conf and included from the server block (nginx-site.conf).
index index.html;
charset utf-8;
error_page 404 /404.html;

gzip on;
gzip_types text/plain text/css text/markdown application/json application/javascript image/svg+xml;

# The export is built with trailingSlash: /work/ is work/index.html, and nginx sends a bare /work
# there itself. Pages revalidate on every visit, so a new build shows up at once.
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Hashed assets never change under the same name.
location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# The keeper renames these into place after every tick (keeper/lib/status.mjs). Never cached, and
# readable from any origin: agents, badges and other sites fetch them directly.
location ~ ^/(status|listings|work)\.json$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# The agent skill, as Markdown rather than nginx's octet-stream default for .md.
location = /skill.md {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
}
