# Pupate's server block, written once by deploy/setup.sh to /etc/nginx/sites-available/__DOMAIN__.
# certbot --nginx adds the TLS listener and the HTTP redirect to this file, so later runs leave it
# alone; the locations live in the snippet, which deploy/update.sh refreshes on every update.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;
    root __WEB_ROOT__;
    include snippets/pupate-__DOMAIN__.conf;
}
