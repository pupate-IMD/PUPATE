# The pre-register list's Worker (README.md walks through the deploy). The D1 database id is the one
# `wrangler d1 create pupate-preregister` prints; the admin key is a secret (`wrangler secret put ADMIN_KEY`),
# never a variable here.
name = "pupate-preregister"
main = "src/index.ts"
compatibility_date = "2026-10-12"

[[d1_databases]]
binding = "DB"
database_name = "pupate-preregister"
database_id = "ea56a0be-f094-48d1-a493-611b607018eb"

# POST /register: three a minute from one connection (keyed on the connection's address, which is never
# stored). The namespace id is any number unique among this account's rate limits.
[[ratelimits]]
name = "REGISTER_LIMIT"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
